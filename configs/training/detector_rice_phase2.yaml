# Detector training -- PHASE 2, curated RICE dataset (Colab GPU).
#
# Differs from detector_gpu.yaml in one material way: this is a TWO-class task.
# The curated RICE split carries only `rice_protect` (COCO id 1) and
# `weed_target` (COCO id 2); there is no `non_target_aquatic` in this dataset.
# num_classes is derived from class_names, so the head is built with 2 outputs.
#
# Data: the grouped, leakage-free, filtered split from
# agrinav_intake_2026-07-21/deliverable/detection/RICE/ (grouped_split.json:
# capture-series families, 40-frame contiguous blocks, weed-balanced 70/20/10).
# Do NOT substitute the Roboflow-native split from RICE.coco.zip -- its
# train/valid/test share video-frame families, so val metrics are inflated.
#
# Backbone: pass --riceseg-backbone <path> on the CLI to warm-start from the
# phase-1 RiceSEG backbone instead of ImageNet. That flag sets
# pretrained_backbone False for you and keeps BN trainable (the RiceSEG running
# stats are in-domain). `pretrained_backbone: true` below is the fallback used
# only when the flag is omitted, so the ImageNet-vs-RiceSEG A/B is one flag.
#
# ann_file / images_root come from the CLI (no machine paths in version control):
#   python -m agrinav.training.weeddet_train \
#     --ann-file  <drive>/rice_phase2/annotations/instances_train.coco.json \
#     --images-root /content/rice_curated/images/train \
#     --config configs/training/detector_rice_phase2.yaml \
#     --riceseg-backbone <drive>/out/riceseg_backbone.pth \
#     --checkpoint-dir <drive>/rice_phase2/runs/<timestamp>

device: cuda                # requires a GPU runtime
seed: 42                    # deterministic RNG seed
deterministic: false        # allow cudnn autotuning for throughput

# --- model ---
# num_classes is derived from class_names; do not set it here.
class_names: [rice_protect, weed_target]  # 2-class: name -> contiguous id order
anchor_base_scale: 3        # anchor base scale (WeedDet default)
lsc_k: 7                    # large-separable-conv kernel in the head
use_atss: true              # ATSS positive/negative anchor assignment

# --- optimisation ---
pretrained_backbone: true   # fallback only; --riceseg-backbone overrides this
img_size: 512               # square letterbox input
batch_size: 8               # fits a T4; raise on an A100 if memory allows
num_workers: 2              # Colab typically exposes ~2 CPU cores
base_lr: 0.001              # WeedDet default SGD LR
momentum: 0.9
weight_decay: 0.0001
num_epochs: 18              # exploratory budget; adjust to available time
save_every: 4               # periodic checkpoint every 4 epochs
repeat_factor: 1            # 1798 train images is already a real epoch
min_lr: 0.00001             # cosine floor
warmup_factor: 0.001        # LR multiplier at warmup start
grad_clip: 0.5              # gradient-norm clip

# --- regularisation / speed ---
augment: true               # geometric + photometric augmentation (label-aligned)
use_amp: true               # mixed precision on GPU
use_ema: true               # track an EMA of weights for the saved checkpoint
ema_decay: 0.999            # EMA decay

# --- outputs ---
# Prefer an absolute --checkpoint-dir on the CLI (a Drive run dir); this
# relative fallback keeps the config path-free for version control.
checkpoint_dir: checkpoints/weeddet_rice_phase2
